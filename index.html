<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOEIC Reading Timer - 900+ Pace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>TOEIC Reading Timer</h1>
        </header>
        
        <div class="time-display">
            <div class="label">Total Elapsed (75:00)</div>
            <div id="total-time" class="time-total">00:00.00</div>
            
            <div id="current-part-label" class="label part-label">Next: Part 5</div>
            <div id="part-time" class="time-part">00:00.00</div>
        </div>

        <div class="controls">
            <button id="btn-start" class="btn btn-primary">Start</button>
            <button id="btn-stop" class="btn btn-danger" disabled>Stop</button>
            <button id="btn-lap" class="btn btn-warning" disabled>Lap</button>
            <button id="btn-reset" class="btn btn-secondary">Reset</button>
        </div>

        <div class="pacing-board">
            <h3>Pacing Board</h3>
            <div class="pace-row" id="row-0">
                <div class="pace-info">
                    <span class="part-name">Part 5</span>
                    <span class="target-val">Target: 10:00</span>
                </div>
                <div class="pace-result" id="result-0">--:--.--</div>
            </div>
            <div class="pace-row" id="row-1">
                <div class="pace-info">
                    <span class="part-name">Part 6</span>
                    <span class="target-val">Target: 10:00</span>
                </div>
                <div class="pace-result" id="result-1">--:--.--</div>
            </div>
            <div class="pace-row" id="row-2">
                <div class="pace-info">
                    <span class="part-name">Part 7</span>
                    <span class="target-val">Target: 55:00</span>
                </div>
                <div class="pace-result" id="result-2">--:--.--</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
